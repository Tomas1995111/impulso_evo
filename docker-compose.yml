services:
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: impulso_bot_evoapi
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1039597030
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://root:password@postgres:5432/evolution
      REDIS_ENABLED: "true"
      REDIS_URI: redis://redis:6379
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      STORE_MESSAGES: "true"
      STORE_MESSAGE_UP: "true"
      STORE_CONTACTS: "true"
      STORE_CHATS: "true"
      LOG_LEVEL: ERROR
      DELAY_MESSAGES: 1000
    depends_on:
      - postgres
      - redis
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:15-alpine
    container_name: postgres_evo
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data

  bot:
    build: .
    container_name: impulso_bot
    restart: always
    command: ["python", "-u", "run_broadcast.py"]
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - evolution_api
    volumes:
      - ./estado_mensajes.json:/app/estado_mensajes.json
      - ./contenido:/app/contenido

  bot_inbound:
    build: .
    container_name: impulso_bot_inbound
    restart: always
    command: ["python", "-u", "run_inbound.py"]
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      - evolution_api
      - redis
    volumes:
      - ./mensajes/credenciales.json:/app/mensajes/credenciales.json:ro

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
