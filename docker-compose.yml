services:
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: impulso_bot_evoapi
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: "http://localhost:8080"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1039597030"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evolution}"
      REDIS_ENABLED: "true"
      REDIS_URI: "redis://redis:6379"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379"
      STORE_MESSAGES: "true"
      STORE_MESSAGE_UP: "true"
      STORE_CONTACTS: "true"
      STORE_CHATS: "true"
      LOG_LEVEL: ERROR
      DELAY_MESSAGES: 1000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    healthcheck:
          test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080' || exit 1"]
          interval: 10s
          timeout: 5s
          retries: 6
          start_period: 20s
  postgres:
    image: postgres:15-alpine
    container_name: postgres_evo
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: impulso_bot
    restart: always
    command: ["python", "-u", "run_broadcast.py"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      evolution_api:
        condition: service_healthy
    volumes:
      - ./mensajes/credenciales.json:/app/mensajes/credenciales.json:ro
      - ./estado_mensajes.json:/app/estado_mensajes.json
      - ./estado_dolar.json:/app/estado_dolar.json
      - ./contenido:/app/contenido

  bot_inbound:
    build: .
    container_name: impulso_bot_inbound
    restart: always
    command: ["python", "-u", "run_inbound.py"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8000:8000"
    depends_on:
      evolution_api:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./mensajes/credenciales.json:/app/mensajes/credenciales.json:ro

  bot_crm:
    build: .
    container_name: impulso_bot_crm
    restart: always
    command: ["python", "-u", "run_crm.py"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      evolution_api:
        condition: service_healthy
    volumes:
      - ./mensajes/credenciales.json:/app/mensajes/credenciales.json:ro

volumes:
  postgres_data:
  redis_data:
  evolution_instances: